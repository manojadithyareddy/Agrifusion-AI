version: '3.8'

services:
  # --- Database ---
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: agrifusion_user
      POSTGRES_PASSWORD: agrifusion_password
      POSTGRES_DB: agrifusion_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrifusion_user -d agrifusion_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Cache ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://agrifusion_user:agrifusion_password@db:5432/agrifusion_db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-this-jwt-secret-in-production}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gemini-2.0-flash}"
    volumes:
      - uploads:/app/uploads
      - ml_models:/app/app/ml/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Background Worker ---
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://agrifusion_user:agrifusion_password@db:5432/agrifusion_db
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gemini-2.0-flash}"
    volumes:
      - ml_models:/app/app/ml/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  ml_models:
