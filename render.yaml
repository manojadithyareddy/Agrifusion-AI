# ====================================================================
# AgriFusion AI — Render Blueprint (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec
# ====================================================================
services:
  # ------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ------------------------------------------------------------------
  - type: web
    name: agrifusion-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: .
      - key: APP_NAME
        value: "AgriFusion AI"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./agri.db"
      - key: LLM_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:5173", "https://*.onrender.com", "https://*.vercel.app"]'

  # ------------------------------------------------------------------
  # 2. Frontend Static Site
  # ------------------------------------------------------------------
  - type: web
    name: agrifusion-frontend
    runtime: static
    rootDir: frontend
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agrifusion-backend
          property: host
