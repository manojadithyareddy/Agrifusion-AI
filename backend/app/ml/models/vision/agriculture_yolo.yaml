# AgriFusion AI — Multimodal Agriculture Intelligence & Decision Agent
# YOLO Dataset Configuration for All Crops, Foliar Diseases & Pests
# ===================================================================
# Standard Ultralytics YOLOv8 / YOLOv11 dataset specification.
# Scaled for multi-crop botanical lesion and pest identification.

path: ../../data/yolo_agriculture # root dataset directory
train: images/train               # train images (relative to 'path')
val: images/val                   # val images (relative to 'path')
test: images/test                 # test images (optional, relative to 'path')

# Number of classes
nc: 24

# Class Names Ontology
names:
  # --- Crop Organ Detection (Classes 0-8) ---
  0: tomato_leaf
  1: potato_leaf
  2: rice_leaf
  3: wheat_leaf
  4: cotton_leaf
  5: maize_leaf
  6: chilli_leaf
  7: mango_leaf
  8: banana_leaf

  # --- Foliar Pathology & Disease Lesions (Classes 9-16) ---
  9: early_blight_lesion
  10: late_blight_lesion
  11: leaf_curl_virus_symptom
  12: rice_blast_lesion
  13: yellow_rust_pustule
  14: powdery_mildew_patch
  15: anthracnose_spot
  16: bacterial_blight_lesion

  # --- Agricultural Pests & Insects (Classes 17-23) ---
  17: whitefly_adult
  18: aphid_colony
  19: stem_borer_larva
  20: fall_armyworm_larva
  21: chilli_thrips
  22: spider_mite
  23: cotton_bollworm
